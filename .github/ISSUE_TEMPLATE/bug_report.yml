name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: How can we reproduce it?
      description: Please provide clear steps to reproduce the issue.
      placeholder: |
        1. Open the app
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: What version of Fractal are you using?
      placeholder: e.g. 1.0.2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device information
      description: What device are you using?
      placeholder: e.g. Pixel 6, Samsung S21
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Android version
      description: What version of Android are you using?
      placeholder: e.g. Android 13
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code blocks.
      render: shell
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
